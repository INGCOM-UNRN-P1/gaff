[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gaff"
version = "0.2.0"
description = "Linter pedagógico de estilo arquitectónico y convenciones obligatorias de cátedra con autofix"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Martín René Vilugrón", email = "martinvilu@gmail.com"}
]
maintainers = [
    {name = "Programación I [B6003] - UNRN Andina"}
]
requires-python = ">=3.11"
keywords = ["education", "c-programming", "pedagogical-tools", "unrn"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "tomli>=1.1.0; python_version < '3.11'",
    # Núcleo común del ecosistema (N-ECO-14): contrato de línea de comandos y textos en español.
    "yutani @ git+https://github.com/INGCOM-UNRN-P1/yutani@e4c8e1050e5dd87a930c5404aba6b65d1be1665a",
]

[project.urls]
Homepage = "https://github.com/INGCOM-UNRN-P1/gaff"
Repository = "https://github.com/INGCOM-UNRN-P1/gaff.git"
Issues = "https://github.com/INGCOM-UNRN-P1/gaff/issues"

[project.scripts]
gaff = "gaff.cli:main"

[project.entry-points."ripley.plugins"]
style = "gaff.ripley_plugin:GaffPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/gaff"]

[tool.hatch.metadata]
# yutani es una referencia directa a git (nunca por nombre en PyPI).
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/gaff"]
omit = ["tests/*"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
