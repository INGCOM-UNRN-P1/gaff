[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gaff"
version = "0.1.0"
description = "Linter pedagógico de estilo arquitectónico y convenciones obligatorias de cátedra con autofix"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.scripts]
gaff = "gaff.cli:main"

[project.entry-points."ripley.plugins"]
style = "gaff.ripley_plugin:GaffPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/gaff"]

[tool.pytest.ini_options]
pythonpath = ["src"]
